<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href below is filled in by `flutter build web` (see the
    `--base-href` option). Do not change it by hand.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="MathPull: a fast maths game. Two players, or you against a bot, race to solve questions and pull the rope.">
  <meta name="theme-color" content="#2563EB">

  <!-- Link preview (when the web address is shared) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MathPull">
  <meta property="og:description" content="Solve fast. Pull the rope. A maths tug-of-war for two players or against a bot.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MathPull">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MathPull</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The same soft blue as the game, so there is no white flash while
       the app loads. */
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(#D6E9FF, #F3F8FF);
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
