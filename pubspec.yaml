# 📁 FILE: pubspec.yaml
# 📌 WHAT: App config with the local notification packages added (version 1.1.0+2)
name: mathpull
description: MathPull, a two-team maths tug-of-war game for Android, iOS and Web.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  google_fonts: ^6.2.1
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/licenses/

# App icon. Run: dart run flutter_launcher_icons
# The pictures are drawn by tools/make_icons.py (assets/icon/).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#EAF3FF"
    theme_color: "#2563EB"

# Splash screen shown while the app starts. Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E3EFFF"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#E3EFFF"
    image: assets/icon/splash_logo.png
  web: false
  ios: false