name: mathpull
description: MathPull, a two-team maths tug-of-war game for Android, iOS and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  google_fonts: ^6.2.1
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/audio/sfx/
    - assets/audio/music/